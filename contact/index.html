<!doctype html><html lang="ko" data-root="../"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1C67FE"><meta name="description" content="카이선셀 제품 개발, 연구 협력, 브랜드 유통 및 사업 제휴 문의 접수"><title>Contact | KAISUNCELL</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../assets/css/style.css?v=contact20261029"><link rel="stylesheet" href="../assets/css/contact.css?v=2"></head><body data-page="contact"><a href="#main" class="skip-to-content">본문 바로가기</a><div id="site-header"></div><main id="main"><section class="ks-contact container"><div class="ks-contact-intro"><span class="eyebrow">CONTACT KAISUNCELL</span><h1>함께 만들어갈<br>가능성을 이야기해주세요.</h1><p>연구·제품 개발부터 브랜드 유통과 기업 제휴까지, 문의 내용을 남겨주시면 담당자가 검토할 수 있도록 준비하겠습니다.</p><div class="ks-contact-direct"><span>BUSINESS CONTACT · 송지은</span><a href="mailto:bizops@kaisuncell.com">bizops@kaisuncell.com</a><p>사업 문의 담당: 송지은</p></div></div><div class="ks-contact-panel"><div class="ks-contact-heading"><h2>문의하기</h2><p>아래 항목을 작성해 주세요. <span aria-hidden="true">*</span> 표시는 필수 입력 항목입니다.</p></div><form id="ks-inquiry" novalidate><div class="ks-form-grid"><div class="ks-field"><label for="ks-type">문의 유형 <span>*</span></label><select id="ks-type" name="type" required><option value="">선택해 주세요</option><option value="research">연구·기술 협력</option><option value="product">제품 개발·OEM/ODM</option><option value="distribution">브랜드 유통·공급</option><option value="partnership">사업 제휴</option><option value="general">기타 문의</option></select></div><div class="ks-field"><label for="ks-company">회사·소속</label><input id="ks-company" name="company" maxlength="120" autocomplete="organization" placeholder="회사 또는 소속명"></div><div class="ks-field"><label for="ks-name">담당자명 <span>*</span></label><input id="ks-name" name="name" maxlength="80" autocomplete="name" required placeholder="성함을 입력해 주세요"></div><div class="ks-field"><label for="ks-email">이메일 <span>*</span></label><input id="ks-email" name="email" type="email" maxlength="200" autocomplete="email" required placeholder="example@company.com"></div><div class="ks-field ks-field-full"><label for="ks-phone">연락처</label><input id="ks-phone" name="phone" type="tel" maxlength="30" autocomplete="tel" placeholder="연락 가능한 번호"></div><div class="ks-field ks-field-full"><label for="ks-subject">문의 제목 <span>*</span></label><input id="ks-subject" name="subject" maxlength="150" required placeholder="문의 제목을 입력해 주세요"></div><div class="ks-field ks-field-full"><label for="ks-message">문의 내용 <span>*</span></label><textarea id="ks-message" name="message" rows="7" minlength="10" maxlength="5000" required placeholder="제안 내용, 필요한 서비스, 일정 등 구체적인 내용을 남겨주세요."></textarea></div></div><div class="ks-consent"><label><input type="checkbox" id="ks-privacy" required><span>문의 응대를 위한 개인정보 수집·이용에 동의합니다. <a href="../privacy/" target="_blank" rel="noopener">개인정보처리방침 보기</a></span></label><p>수집항목: 성명, 이메일, 입력한 연락처·회사명·문의내용 / 이용목적: 문의 확인 및 답변. 보관기간은 개인정보처리방침 및 운영정책에 따릅니다.</p></div><div class="ks-form-actions"><button type="submit" class="btn btn-dark" id="ks-send">문의 접수하기</button><p id="ks-form-status" role="status" aria-live="polite"></p></div></form></div></section></main><div id="site-footer"></div><script defer src="../assets/js/main.js"></script><script defer src="../assets/js/inquiry.js"></script></body></html>
