<!doctype html><html lang="zh-CN" data-root="../../"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1C67FE"><meta name="description" content="凯善赛尔商务合作与产品开发咨询表单。"><title>凯善赛尔 | KAISUNCELL</title><link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../assets/css/style.css?v=zh20261030"><link rel="stylesheet" href="../../assets/css/contact.css?v=2"></head><body data-page="contact"><a href="#main" class="skip-to-content">Skip to content</a><div id="site-header"></div><main id="main"><section class="ks-contact container"><div class="ks-contact-intro"><span class="eyebrow">CONTACT KAISUNCELL</span><h1>共同探索新的可能。</h1><p>从研发、产品开发到品牌分销与商业合作，欢迎向我们的团队提交咨询。</p><div class="ks-contact-direct"><span>BUSINESS CONTACT · Song Ji-eun</span><a href="mailto:bizops@kaisuncell.com">bizops@kaisuncell.com</a><p>商务联系人：宋智恩</p></div></div><div class="ks-contact-panel"><div class="ks-contact-heading"><h2>提交咨询</h2><p>请填写以下信息。* 为必填项。</p></div><form id="ks-inquiry" novalidate><div class="ks-form-grid"><div class="ks-field"><label for="ks-type">咨询类型 <span>*</span></label><select id="ks-type" name="type" required><option value="">请选择</option><option value="research">研发与技术合作</option><option value="product">产品开发 · OEM/ODM</option><option value="distribution">品牌分销与供货</option><option value="partnership">商务合作</option><option value="general">其他咨询</option></select></div><div class="ks-field"><label for="ks-company">公司 / 机构</label><input id="ks-company" name="company" maxlength="120" autocomplete="organization" placeholder="公司或机构名称"></div><div class="ks-field"><label for="ks-name">联系人姓名 <span>*</span></label><input id="ks-name" name="name" maxlength="80" autocomplete="name" required placeholder="请输入姓名"></div><div class="ks-field"><label for="ks-email">Email <span>*</span></label><input id="ks-email" name="email" type="email" maxlength="200" autocomplete="email" required placeholder="example@company.com"></div><div class="ks-field ks-field-full"><label for="ks-phone">联系电话</label><input id="ks-phone" name="phone" type="tel" maxlength="30" autocomplete="tel" placeholder="请输入联系电话"></div><div class="ks-field ks-field-full"><label for="ks-subject">咨询标题 <span>*</span></label><input id="ks-subject" name="subject" maxlength="150" required placeholder="请输入标题"></div><div class="ks-field ks-field-full"><label for="ks-message">咨询内容 <span>*</span></label><textarea id="ks-message" name="message" rows="7" minlength="10" maxlength="5000" required placeholder="请说明项目需求及预期时间。"></textarea></div></div><div class="ks-consent"><label><input type="checkbox" id="ks-privacy" required><span>我同意为处理咨询而收集和使用所提供的个人信息。 <a href="../../privacy/" target="_blank" rel="noopener">查看隐私政策</a></span></label><p>收集的信息包括姓名、邮箱，以及您提供的电话、公司和咨询内容。用于核实及回复咨询，保存期限遵循隐私政策。</p></div><div class="ks-form-actions"><button type="submit" class="btn btn-dark" id="ks-send">提交咨询</button><p id="ks-form-status" role="status" aria-live="polite"></p></div></form></div></section></main><div id="site-footer"></div><script defer src="../../assets/js/main.js"></script><script defer src="../../assets/js/inquiry.js"></script></body></html>
